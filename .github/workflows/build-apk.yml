name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o MuhammadiReportCardApp.zip -d extracted

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        run: |
          echo "Searching for settings.gradle..."
          find extracted -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuhammadiReportCardApp
          path: "extracted/**/build/outputs/apk/**/*.apk"
