name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o MuhammadiReportCardApp.zip -d extracted

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Gradle project
        run: |
          find extracted -name "gradlew" -type f

      - name: Make gradlew executable
        run: |
          chmod +x $(find extracted -name "gradlew" -type f | head -1)

      - name: Build APK
        run: |
          cd $(dirname $(find extracted -name "gradlew" -type f | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuhammadiReportCardApp
          path: extracted/**/build/outputs/apk/**/*.apk
